<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inicia sesión en EATSY! para continuar tu pedido.">
  <title>EATSY! | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800;900&family=Roboto+Slab:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body class="auth-page page-login">
  <main class="login-main">
    <h1 class="auth-heading">INICIAR SESIÓN</h1>
    <a href="index.html" class="auth-logo" aria-label="EATSY! - volver al inicio"><svg viewBox="0 0 100 150" role="img" aria-label="Logo de EATSY"><circle cx="50" cy="76" r="48" fill="#fff"/><g fill="none" stroke="#4e7b38" stroke-linecap="round" stroke-linejoin="round"><path d="M35 38v25M43 35v28M51 36v28M59 39v24M34 61c0 9 3 14 10 18v41M59 62c0 9-2 14-8 18v40" stroke-width="5"/><path d="M58 33c4-13 16-18 25-16-1 13-10 22-24 22" fill="#4e7b38" stroke-width="2"/></g></svg></a>
    <button class="google-button" type="button" data-google-login><span class="google-g" aria-hidden="true">G</span><span>Continuar con Google</span></button>
    <hr class="auth-divider">
    <form class="auth-form" id="login-form">
      <div class="auth-field"><label for="login-email">Correo electrónico</label><input id="login-email" name="email" type="email" autocomplete="email" required></div>
      <div class="auth-field"><label for="login-password">Contraseña</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
      <a href="#recuperar" class="auth-text-link" data-forgot-password>¿Olvidaste tu contraseña?</a>
      <button class="auth-submit" type="submit">Ingresar</button>
      <p class="auth-status" id="login-status" role="status" aria-live="polite"></p>
    </form>
    <a href="index.html" class="auth-guest">Continuar como invitado</a>
  </main>
  <footer class="auth-bottom-cta">
    <p>¿Eres nuevo? ¡Regístrate!</p>
    <a href="registro.html">AQUÍ</a>
  </footer>
</body>
</html>
