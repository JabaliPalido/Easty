<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Revisa tu pedido y elige un método de pago en EATSY!.">
  <title>EATSY! | Realizar pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800;900&family=Roboto+Slab:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body class="page-checkout">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="EATSY, ir al inicio"><img class="brand-image" src="img/logo-eatsy.svg" alt="EATSY!"></a>
    <span aria-hidden="true"></span>
    <nav class="header-actions" aria-label="Accesos rápidos">
      <a href="pago.html" aria-label="Carrito y pago" class="header-icon cart-icon"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.4L22 8H7"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg><span class="cart-count" aria-live="polite">0</span></a>
      <a href="index.html#transparencia" aria-label="Ayuda e información" class="header-icon"><svg viewBox="0 0 24 24"><path d="M12 2.5 20 6v5.8c0 5.1-3.3 8.5-8 10.2-4.7-1.7-8-5.1-8-10.2V6z"/><path d="m8.5 12 2.3 2.3 4.8-5"/></svg></a>
      <a href="login.html" aria-label="Mi cuenta" class="header-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.2"/><path d="M3 21v-1.7a5.8 5.8 0 0 1 11.6 0V21M18 8v8M14 12h8"/></svg></a>
    </nav>
  </header>
  <main class="checkout-main">
    <h1 class="checkout-title">REALIZAR PEDIDO</h1>
    <section class="checkout-summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Resumen de orden</h2>
      <article class="checkout-item">
        <img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=85" alt="Curry de garbanzos con arroz integral">
        <p>Total: <span id="checkout-total">25.90</span></p>
      </article>
    </section>
    <form id="payment-form">
      <section class="payment-methods" aria-labelledby="payment-title">
        <h2 id="payment-title">Métodos de Pago</h2>
        <div class="payment-list">
          <label class="payment-option"><span class="payment-label"><input type="radio" name="payment-method" value="tarjeta" required><span>Tarjeta de crédito/Débito</span></span><span class="payment-brands" aria-label="Marcas de tarjeta"><span class="payment-brand brand-mastercard">Mastercard</span><span class="payment-brand brand-diners">Diners</span></span></label>
          <label class="payment-option"><span class="payment-label"><input type="radio" name="payment-method" value="billetera"><span>Billetera Digital</span></span><span class="payment-brands" aria-label="Billeteras digitales"><span class="payment-brand brand-yape">yape</span><span class="payment-brand brand-plin">plin</span></span></label>
          <label class="payment-option"><span class="payment-label"><input type="radio" name="payment-method" value="efectivo"><span>Efectivo</span></span><span class="payment-brands"><span class="payment-brand brand-cash">S/</span></span></label>
          <label class="payment-option"><span class="payment-label"><input type="radio" name="payment-method" value="contraentrega"><span>Contraentrega (POs)</span></span><span class="payment-brands"><span class="payment-brand brand-culqi">Culqi<span aria-hidden="true">◉</span></span></span></label>
        </div>
      </section>
      <section class="checkout-consents" aria-label="Consentimientos">
        <label><input type="checkbox" name="terms" required><span>*He leído y acepto los Términos y Condiciones y Políticas de Privacidad</span></label>
        <label><input type="checkbox" name="marketing"><span>*Acepto el envío de recordatorios, promociones y otros fines adicionales</span></label>
      </section>
      <button class="auth-submit checkout-pay" type="submit">REALIZAR PAGO</button>
      <p class="auth-status" id="payment-status" role="status" aria-live="polite"></p>
      <p class="checkout-hint">Demostración visual: no se procesará ningún cobro real.</p>
    </form>
  </main>
  <footer class="site-footer"><p>© Copyright y Derechos reservados 2026</p><div class="footer-contact"><strong>Contáctanos:</strong><a class="social-icon" href="https://www.facebook.com/" aria-label="Facebook">f</a><a class="social-icon mail-social" href="mailto:hola@eatsy.example" aria-label="Correo">✉</a><a class="social-icon whatsapp-social" href="https://wa.me/51999999999" aria-label="WhatsApp">◔</a><a href="tel:+51999999999" class="phone-link">999-999-999</a></div></footer>
</body>
</html>
